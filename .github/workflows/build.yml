name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-ui:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test native Windows capture selection
        shell: powershell
        run: go test ./internal/airplay -run 'TestWindowsCapture(PreparationSkipsPipeWireResources|SourceStage)$'

      - name: Test receiver selection parsing in Windows PowerShell
        shell: powershell
        run: .\scripts\test-windows-discovery.ps1

  packages:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install packaging tool
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Test and build Linux and Windows packages
        run: ./scripts/build-packages.sh "${GITHUB_SHA::7}"

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: airplay-mirror-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
