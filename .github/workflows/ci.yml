name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test

  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            suffix: ""
          - runner: ubuntu-24.04-arm
            suffix: "-arm64"
    runs-on: ${{ matrix.runner }}
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build doubletake
        run: make doubletake-release

      - name: Build doubletake-ctl
        run: make doubletake-ctl-release

      - name: Build doubletake-test-receiver
        run: make doubletake-test-receiver-release

      - name: Bundle manpages
        if: matrix.suffix == ''
        run: make manpages-release

      - name: Add architecture suffix
        if: matrix.suffix != ''
        run: |
          mv doubletake "doubletake${{ matrix.suffix }}"
          mv doubletake-ctl "doubletake-ctl${{ matrix.suffix }}"
          mv doubletake-test-receiver "doubletake-test-receiver${{ matrix.suffix }}"

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets${{ matrix.suffix }}
          path: |
            doubletake${{ matrix.suffix }}
            doubletake-ctl${{ matrix.suffix }}
            doubletake-test-receiver${{ matrix.suffix }}
            doubletake-manpages.tar.gz
